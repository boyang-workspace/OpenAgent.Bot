name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    name: Build, type-check, and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run seo:audit:source
      - run: npm run knowledge:check
      - run: node --check mcp/server.mjs
      - run: npm run build
