name: Registry Sync

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    name: Sync canonical and official sources
    runs-on: ubuntu-latest
    steps:
      - name: Sync GitHub subscriptions in bounded batches
        env:
          SYNC_TOKEN: ${{ secrets.REGISTRY_SYNC_TOKEN }}
          GITHUB_API_TOKEN: ${{ github.token }}
          SYNC_URL: https://www.openagent.bot/api/internal/sync.json
        run: |
          set -euo pipefail
          for batch in $(seq 1 12); do
            response=$(curl --fail-with-body --silent --show-error --max-time 90 --retry 4 --retry-all-errors --retry-delay 5 \
              --request POST \
              --header "Authorization: Bearer ${SYNC_TOKEN}" \
              --header "X-GitHub-Token: ${GITHUB_API_TOKEN}" \
              --header "Origin: https://www.openagent.bot" \
              "${SYNC_URL}?source=github&offset=0&limit=20")
            processed=$(jq -r '.processed' <<<"${response}")
            errors=$(jq -r '.errors | length' <<<"${response}")
            echo "GitHub batch ${batch}: ${processed} processed, ${errors} errors"
            attempted=$((processed + errors))
            if [ "${attempted}" -lt 20 ]; then break; fi
          done

      - name: Sync Hugging Face subscriptions in bounded batches
        if: always()
        env:
          SYNC_TOKEN: ${{ secrets.REGISTRY_SYNC_TOKEN }}
          SYNC_URL: https://www.openagent.bot/api/internal/sync.json
        run: |
          set -euo pipefail
          for batch in $(seq 1 6); do
            response=$(curl --fail-with-body --silent --show-error --max-time 90 --retry 4 --retry-all-errors --retry-delay 5 \
              --request POST \
              --header "Authorization: Bearer ${SYNC_TOKEN}" \
              --header "Origin: https://www.openagent.bot" \
              "${SYNC_URL}?source=huggingface&offset=0&limit=20")
            processed=$(jq -r '.processed' <<<"${response}")
            errors=$(jq -r '.errors | length' <<<"${response}")
            echo "Hugging Face batch ${batch}: ${processed} processed, ${errors} errors"
            attempted=$((processed + errors))
            if [ "${attempted}" -lt 20 ]; then break; fi
          done

      - name: Sync NVIDIA official feed
        if: always()
        env:
          SYNC_TOKEN: ${{ secrets.REGISTRY_SYNC_TOKEN }}
          SYNC_URL: https://www.openagent.bot/api/internal/sync.json
        run: |
          curl --fail-with-body --silent --show-error --max-time 90 --retry 4 --retry-all-errors --retry-delay 5 \
            --request POST \
            --header "Authorization: Bearer ${SYNC_TOKEN}" \
            --header "Origin: https://www.openagent.bot" \
            "${SYNC_URL}?source=nvidia-developer&limit=20" >/dev/null

      - name: Sync release and package subscriptions
        if: always()
        env:
          SYNC_TOKEN: ${{ secrets.REGISTRY_SYNC_TOKEN }}
          GITHUB_API_TOKEN: ${{ github.token }}
          SYNC_URL: https://www.openagent.bot/api/internal/sync.json
        run: |
          set -euo pipefail
          had_errors=0
          for source in github-releases npm; do
            limit=10
            max_batches=18
            if [ "${source}" = "github-releases" ]; then
              limit=5
              max_batches=36
            fi
            for batch in $(seq 1 "${max_batches}"); do
              if ! response=$(curl --fail-with-body --silent --show-error --max-time 90 --retry 4 --retry-all-errors --retry-delay 5 \
                --request POST \
                --header "Authorization: Bearer ${SYNC_TOKEN}" \
                --header "X-GitHub-Token: ${GITHUB_API_TOKEN}" \
                --header "Origin: https://www.openagent.bot" \
                "${SYNC_URL}?source=${source}&limit=${limit}"); then
                had_errors=1
                break
              fi
              processed=$(jq -r '.processed' <<<"${response}")
              errors=$(jq -r '.errors | length' <<<"${response}")
              echo "${source} batch ${batch}: ${processed} processed, ${errors} errors"
              if [ "$errors" -gt 0 ]; then had_errors=1; fi
              if [ "$((processed + errors))" -lt "${limit}" ]; then break; fi
            done
          done
          exit "$had_errors"

      - name: Sync public model and app usage
        if: always()
        env:
          SYNC_TOKEN: ${{ secrets.REGISTRY_SYNC_TOKEN }}
          USAGE_SYNC_URL: https://www.openagent.bot/api/internal/usage-sync.json
        run: |
          response=$(curl --fail-with-body --silent --show-error --max-time 120 --retry 4 --retry-all-errors --retry-delay 5 \
            --request POST \
            --header "Authorization: Bearer ${SYNC_TOKEN}" \
            --header "Origin: https://www.openagent.bot" \
            "${USAGE_SYNC_URL}?dataset=all")
          echo "Usage sync: $(jq -c '{status,sourceId,startDate,endDate,results,reason}' <<<"${response}")"
