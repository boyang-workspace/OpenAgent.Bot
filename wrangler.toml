name = "openagent-bot"
main = "worker.js"
compatibility_date = "2026-09-05"
routes = [
  { pattern = "www.openagent.bot/*", zone_name = "openagent.bot" },
  { pattern = "openagent.bot/*", zone_name = "openagent.bot" }
]

[assets]
binding = "ASSETS"
directory = "./dist"
not_found_handling = "404-page"
html_handling = "auto-trailing-slash"
run_worker_first = true

[observability]
enabled = true
